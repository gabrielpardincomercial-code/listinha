<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#090a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Listinha" />
    <meta name="application-name" content="Listinha" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Listinha • Sua lista de supermercado colaborativa em tempo real com design Apple Liquid Glass, suporte a unidades e quilos, lista da família e happy hour."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.json?v=3" />

    <!-- Google Identity Services for real Google OAuth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <title>Listinha • Compras Colaborativas em Tempo Real</title>

    <style>
      /* Safe area insets for iOS devices (iPhone Dynamic Island / Notch / Home Indicator) */
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }

      * {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      body {
        overscroll-behavior-y: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Custom iOS Liquid Glass Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body class="bg-[#090b10] text-slate-100 min-h-screen selection:bg-blue-500/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
